<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
  <title>Private Admin | Voice-O-Magic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>window.tailwind=window.tailwind||{};window.tailwind.config={theme:{extend:{colors:{gold:'var(--gold)'}}}};</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body class="bg-theme text-main font-sans antialiased min-h-screen">
  <script>
  (function(){
    'use strict';

    function applyTheme(dark){
      document.documentElement.classList.toggle('dark', Boolean(dark));
      try { localStorage.setItem('vom-theme', dark ? 'dark' : 'light'); } catch {}
    }

    function initialTheme(){
      try {
        const stored=localStorage.getItem('vom-theme');
        if(stored) return stored==='dark';
      } catch {}
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    }

    applyTheme(initialTheme());
    window.addEventListener('vom-admin-theme-toggle', event => applyTheme(Boolean(event.detail)));

    const rootClass='min-h-screen flex items-center justify-center p-6 text-center';
    const panelClass='material-card max-w-xl w-full p-8 text-left';
    const api=async(mode,options={})=>{
      const response=await fetch('/api/chat?mode='+encodeURIComponent(mode),{
        cache:'no-store',
        credentials:'same-origin',
        ...options
      });
      const body=await response.json().catch(()=>({}));
      return {response,body};
    };

    function showShell(){
      document.body.replaceChildren();
      const main=document.createElement('main');
      main.className=rootClass;
      const panel=document.createElement('section');
      panel.className=panelClass;
      main.append(panel);
      document.body.append(main);
      return panel;
    }

    function showLogin(message=''){
      const panel=showShell();
      panel.innerHTML='';
      const eyebrow=document.createElement('div');
      eyebrow.className='text-sm font-bold uppercase tracking-wider text-gold';
      eyebrow.textContent='Voice-O-Magic Admin';
      const title=document.createElement('h1');
      title.className='text-2xl font-bold text-heading mt-2';
      title.textContent='Private Control Center';
      const copy=document.createElement('p');
      copy.className='text-sm text-sec leading-relaxed mt-3';
      copy.textContent='Authorized administrator access only.';
      const form=document.createElement('form');
      form.className='mt-6 space-y-4';
      const label=document.createElement('label');
      label.className='block';
      const caption=document.createElement('span');
      caption.className='block text-sm font-semibold text-sec mb-1.5';
      caption.textContent='Administrator password';
      const input=document.createElement('input');
      input.className='md-input';
      input.type='password';
      input.autocomplete='current-password';
      input.required=true;
      const error=document.createElement('p');
      error.className='text-sm text-red';
      error.hidden=!message;
      error.textContent=message;
      const button=document.createElement('button');
      button.className='btn-primary w-full';
      button.type='submit';
      button.textContent='Sign in';
      label.append(caption,input);
      form.append(label,error,button);
      panel.append(eyebrow,title,copy,form);
      form.addEventListener('submit',async event=>{
        event.preventDefault();
        error.hidden=true;
        button.disabled=true;
        button.textContent='Signing in…';
        try{
          const {response,body}=await api('admin-login',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({password:input.value})
          });
          if(response.status===401) throw new Error(body.error||'Invalid password.');
          if(!response.ok) throw new Error(body.error||'Admin authentication is temporarily unavailable.');
          await bootAdmin();
        }catch(err){
          error.textContent=err.message||'Login failed.';
          error.hidden=false;
        }finally{
          button.disabled=false;
          button.textContent='Sign in';
        }
      });
      input.focus();
    }

    function showFatal(message){
      const panel=showShell();
      panel.className=panelClass+' text-center';
      panel.innerHTML='';
      const eyebrow=document.createElement('div');
      eyebrow.className='text-sm font-bold uppercase tracking-wider text-gold';
      eyebrow.textContent='Voice-O-Magic Admin';
      const title=document.createElement('h1');
      title.className='text-2xl font-bold text-heading mt-2';
      title.textContent='Unable to load the admin console';
      const copy=document.createElement('p');
      copy.className='text-sm text-sec leading-relaxed mt-4';
      copy.textContent=message;
      const hint=document.createElement('p');
      hint.className='text-xs text-muted mt-3';
      hint.textContent='Check the deployment configuration and CMS environment variables, then retry.';
      const retry=document.createElement('button');
      retry.className='btn-primary mt-6';
      retry.type='button';
      retry.textContent='Retry';
      retry.onclick=()=>location.reload();
      panel.append(eyebrow,title,copy,hint,retry);
    }

    async function loadScriptSource(path){
      const response=await fetch(path,{cache:'no-store',credentials:'same-origin'});
      if(!response.ok) throw new Error('Unable to load '+path+'.');
      const source=await response.text();
      const script=document.createElement('script');
      script.textContent=source;
      document.body.append(script);
    }

    function waitForAdminDashboard(){
      return new Promise(resolve=>{
        if(document.getElementById('saveAll')) return resolve();
        const observer=new MutationObserver(()=>{
          if(document.getElementById('saveAll')){
            observer.disconnect();
            resolve();
          }
        });
        observer.observe(document.body,{childList:true,subtree:true});
      });
    }

    async function bootAdmin(){
      const panel=document.createElement('main');
      panel.className=rootClass;
      const loader=document.createElement('section');
      loader.className=panelClass+' text-center';
      loader.textContent='Loading admin console…';
      panel.append(loader);
      document.body.replaceChildren(panel);
      await loadScriptSource('/js/admin.js');
      await waitForAdminDashboard();
      await loadScriptSource('/js/admin-weekly-cms.js');
      if(window.VOMWeeklyAdmin?.load) await window.VOMWeeklyAdmin.load();
    }

    (async function(){
      try{
        const {response,body}=await api('admin-data');
        if(response.ok){
          await bootAdmin();
          return;
        }
        if(response.status===401){
          showLogin();
          return;
        }
        showFatal(body.error||'Admin authentication is temporarily unavailable.');
      }catch(error){
        showFatal(error.message||'Unable to contact the Admin service.');
      }
    })();
  })();
  </script>
  <script src="/js/reicon-image-loading.js"></script>
</body>
</html>
