<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
  <title>Private Admin | Voice-O-Magic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <script>
    window.tailwind = window.tailwind || {};
    window.tailwind.config = { theme: { extend: { colors: { gold: 'var(--gold)' } } } };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>:root{--gold:#c9a227}body{background:#f7f6f2}</style>
</head>
<body class="bg-theme text-main font-sans antialiased min-h-screen">
  <script>
    // Dedicated admin entry point: the shared application then renders only the authenticated admin flow.
    const url = new URL(window.location.href);
    url.searchParams.set('admin', '1');
    window.history.replaceState({}, '', url.toString());
  </script>
  <script src="js/main.js"></script>
</body>
</html>
