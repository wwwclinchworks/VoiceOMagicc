<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
  <title>Private Admin | Voice-O-Magic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>window.tailwind=window.tailwind||{};window.tailwind.config={theme:{extend:{colors:{gold:'var(--gold)'}}}};</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body class="bg-theme text-main font-sans antialiased min-h-screen">
  <script>
  (async function(){
    try{
      const response=await fetch('/js/admin.js',{cache:'no-store'});
      if(!response.ok)throw new Error('Unable to load admin client.');
      let source=await response.text();
      source=source.replace(
        "const sectionKeys={Page_Copy:'settings',Featured_Video:'featuredVideo',Resources:'resources','Speaker_Toolkit':'toolkit',Books:'books'};",
        "const sectionKeys={Page_Copy:'settings','Page Copy':'settings',Featured_Video:'featuredVideo','Featured Video':'featuredVideo',Resources:'resources','Speaker_Toolkit':'toolkit','Speaker Toolkit':'toolkit',Books:'books'};"
      );
      const script=document.createElement('script');
      script.textContent=source;
      document.body.append(script);

      let attempts=0;
      const weeklyLoader=setInterval(async()=>{
        attempts+=1;
        if(!document.getElementById('saveAll')){
          if(attempts>=80)clearInterval(weeklyLoader);
          return;
        }
        clearInterval(weeklyLoader);
        try{
          const weeklyResponse=await fetch('/js/admin-weekly-cms.js',{cache:'no-store'});
          if(!weeklyResponse.ok)throw new Error('Unable to load Weekly Highlights editor.');
          const weeklySource=await weeklyResponse.text();
          const weeklyScript=document.createElement('script');
          weeklyScript.textContent=weeklySource;
          document.body.append(weeklyScript);
          if(window.VOMWeeklyAdmin?.load) await window.VOMWeeklyAdmin.load();
        }catch(error){
          const node=document.createElement('div');
          node.className='fixed right-5 bottom-5 z-[200] rounded-xl px-4 py-3 text-sm font-semibold text-white shadow-xl';
          node.style.background='#b42318';
          node.textContent='Weekly Highlights unavailable: '+(error.message||'Failed to load.');
          document.body.append(node);
          setTimeout(()=>node.remove(),5000);
        }
      },100);
    }catch(error){
      document.body.replaceChildren();
      const box=document.createElement('main');
      box.className='min-h-screen flex items-center justify-center p-6 text-center';
      const message=document.createElement('p');
      message.className='text-red font-semibold';
      message.textContent=error.message||'Unable to load the admin console.';
      box.append(message);
      document.body.append(box);
    }
  })();
  </script>
  <script>
  (function(){
    function apply(dark){
      document.documentElement.classList.toggle('dark',dark);
      try{localStorage.setItem('vom-theme',dark?'dark':'light')}catch{}
    }
    function initial(){try{const s=localStorage.getItem('vom-theme');if(s)return s==='dark'}catch{}return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches}
    apply(initial());
    window.addEventListener('vom-admin-theme-toggle',function(event){apply(Boolean(event.detail));});
  })();
  </script>
  <script src="/js/reicon-image-loading.js"></script>
</body>
</html>
