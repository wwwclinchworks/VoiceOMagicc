<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet">
  <title>Private Admin | Voice-O-Magic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <script>
    window.tailwind = window.tailwind || {};
    window.tailwind.config = {
      theme: { extend: { colors: { gold: 'var(--gold)' } } }
    };
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <style>
    :root { --gold: #c9a227; }
    body { background: #f7f6f2; }
    .admin-shell { min-height: 100vh; }
    .admin-nav button.active { background: #111; color: #fff; }
    .admin-panel { display: none; }
    .admin-panel.active { display: block; }
    .admin-input { width: 100%; border: 1px solid #d8d8d2; border-radius: 10px; padding: 10px 12px; background: #fff; outline: none; }
    .admin-input:focus { border-color: #c9a227; box-shadow: 0 0 0 3px rgba(201,162,39,.12); }
    .admin-muted { color: #666; }
    .status-pill { display:inline-flex; align-items:center; gap:6px; padding:4px 9px; border-radius:999px; font-size:11px; font-weight:700; }
    .status-ok { background:#e8f7ed; color:#137333; }
    .status-off { background:#f2f2ef; color:#666; }
    .toast { position:fixed; right:20px; bottom:20px; z-index:100; max-width:360px; padding:12px 14px; border-radius:12px; color:#fff; background:#111; box-shadow:0 12px 30px rgba(0,0,0,.2); }
  </style>
</head>
<body>
  <div id="adminApp" class="admin-shell"></div>
  <script src="js/admin.js"></script>
</body>
</html>
