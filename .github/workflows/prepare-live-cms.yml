name: Prepare live CMS rendering fix
on:
  push:
    branches: [fix/live-cms-rendering-complete-v2]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch public CMS rendering
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/main.js')
          s = p.read_text()
          old = "const response = await fetch(`/data/knowledge.json?cms=${Date.now()}`, { cache: 'no-store', signal: controller.signal });"
          new = "const response = await fetch('/api/chat?mode=public-cms', { cache: 'no-store', signal: controller.signal });"
          if old not in s:
              raise SystemExit('Expected CMS fetch statement not found')
          s = s.replace(old, new, 1)
          marker = "  function renderResources() {\n"
          helper = '''  function highlightCard(item) {\n    const card = create('article', 'material-card overflow-hidden');\n    const imageUrl = safeUrl(item.imageUrl || '');\n    if (imageUrl) {\n      const image = document.createElement('img');\n      image.src = imageUrl;\n      image.alt = item.title || 'Weekly Highlight';\n      image.loading = 'lazy';\n      image.decoding = 'async';\n      image.referrerPolicy = 'no-referrer';\n      image.style.cssText = 'display:block;width:100%;aspect-ratio:4/3;object-fit:cover';\n      card.append(image);\n    }\n    const body = create('div', 'p-6');\n    body.append(create('h3', 'font-bold text-heading text-lg', item.title || 'Weekly Highlight'));\n    if (item.description) body.append(create('p', 'text-sm text-sec leading-relaxed mt-2', item.description));\n    card.append(body);\n    return card;\n  }\n\n'''
          if marker not in s:
              raise SystemExit('renderResources marker not found')
          s = s.replace(marker, helper + marker, 1)
          anchor = "    main.append(videoBox);\n\n    const resources = Array.isArray(state.cms.resources) ? state.cms.resources : [];"
          replacement = """    main.append(videoBox);\n\n    const highlights = state.cms.weeklyHighlights || {};\n    const publishedHighlights = [highlights.highlight1, highlights.highlight2]\n      .filter((item) => item && item.published && safeUrl(item.imageUrl || ''));\n    if (publishedHighlights.length) {\n      const section = create('section', 'mt-16');\n      section.append(create('h2', 'font-display text-3xl font-bold text-heading', 'Weekly Highlights'));\n      const grid = create('div', 'grid grid-cols-1 md:grid-cols-2 gap-6 mt-7');\n      publishedHighlights.forEach((item) => grid.append(highlightCard(item)));\n      section.append(grid);\n      main.append(section);\n    }\n\n    const resources = Array.isArray(state.cms.resources) ? state.cms.resources : [];"""
          if anchor not in s:
              raise SystemExit('video/resources anchor not found')
          s = s.replace(anchor, replacement, 1)
          p.write_text(s)
          PY
      - name: Verify syntax
        run: node --check js/main.js
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/main.js
          git commit -m 'fix: render live CMS content and weekly highlights' || exit 0
          git push
      # trigger a second workflow run so the patch commit is created
