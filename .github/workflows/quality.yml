name: VoiceOMagic QA

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run production QA checks
        run: node scripts/qa-check.mjs
      - name: Run Admin authentication/bootstrap regression checks
        run: node qa/admin-auth-bootstrap-regression.mjs
      - name: Run production runtime regression checks
        run: node qa/production-runtime-regression.mjs
      - name: Validate Cloudflare Worker syntax
        run: node --check worker.js && node --check worker-entry.js
      - name: Run security smoke checks
        run: node scripts/security-smoke.mjs
