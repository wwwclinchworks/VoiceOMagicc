name: VoiceOMagic QA

on:
  push:
    branches: [main, 'agent/**', 'fix/**', 'refactor/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run production QA checks
        run: node scripts/qa-check.mjs
      - name: Run admin console regression checks
        run: node qa/admin-console-regression.mjs
      - name: Run security smoke checks
        run: node scripts/security-smoke.mjs
      - name: Run live CMS rendering regression checks
        run: node qa/live-cms-rendering-regression.mjs
      - name: Run production source contract checks
        run: node qa/production-source-contract.mjs
      - name: Run Weekly Highlights API contract checks
        run: node qa/weekly-highlights-api-contract.mjs
      - name: Validate Cloudflare Worker syntax
        run: node --check worker.js
      - name: Validate Cloudflare Worker entry syntax
        run: node --check worker-entry.js
      - name: Validate Cloudflare Worker configuration
        run: npx --yes wrangler@latest deploy --dry-run
